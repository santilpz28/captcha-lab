[pytest]
testpaths = tests
python_files = test_*.py
# tests/test_e2e.py is a standalone script (it starts its own server and
# prints a PASS/FAIL report), not a pytest module. Running it with
# pytest fails on its `base` fixture, which pytest does not provide.
# Run it directly:  python3 tests/test_e2e.py
addopts = -q --ignore=tests/test_e2e.py
